<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux House | Inmobiliaria de Lujo</title>
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <svg width="45" height="45" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10L15 40V90H85V40L50 10Z" stroke="#C5A059" stroke-width="6" stroke-linejoin="round"/>
                
                <path d="M30 50V75H45" stroke="#C5A059" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

                <path d="M55 50V75" stroke="#C5A059" stroke-width="6" stroke-linecap="round"/>
                <path d="M70 50V75" stroke="#C5A059" stroke-width="6" stroke-linecap="round"/>
                <path d="M55 62.5H70" stroke="#C5A059" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <h2>LUX HOUSE</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/">INICIO</a></li>
            <li><a href="/html/catalogo.html">CATÁLOGO</a></li>
            <li><a href="#">SERVICIOS</a></li>
            <li><a href="#">TRÁMITES</a></li>
            <li><a href="#">BLOG</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>SOMOS UNA INMOBILIARIA QUE QUIERE QUE ENCUENTRES TU PRÓXIMO HOGAR</h1>
            <button class="btn-agenda" onclick="abrirModalOpciones()">AGENDA UNA CITA</button>
        </div>
    </header>

    <div id="modalOpciones" class="modal-overlay" style="display: none;">
        <div class="glass-card modal-content" style="background: var(--bg-superficies); border: 1px solid var(--borde-sutil); border-radius: 15px; padding: 40px; text-align: center; max-width: 450px; width: 90%;">
            <h3 style="color: var(--texto-principal); font-size: 1.8rem; margin-bottom: 15px;">¿En qué podemos ayudarte?</h3>
            <p style="color: var(--texto-secundario); margin-bottom: 25px;">Selecciona la operación que deseas realizar para dirigirte al formulario adecuado.</p>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Estos botones llevarán a los 3 nuevos archivos que crearemos -->
                <button class="btn-opcion" onclick="window.location.href='/html/comprar.html'">Quiero Comprar una Propiedad</button>
                <button class="btn-opcion" onclick="window.location.href='/html/vender.html'">Quiero Vender mi Propiedad</button>
                <button class="btn-opcion" onclick="window.location.href='/html/tramite.html'">Trámite o Servicio Especializado</button>
            </div>

            <!-- Botón para cerrar la ventanita -->
            <button onclick="cerrarModalOpciones()" style="margin-top: 25px; background: transparent; border: none; color: var(--texto-secundario); cursor: pointer; text-decoration: underline; font-size: 0.9rem;">Cancelar</button>
        </div>
    </div>

    <button id="btn-tema" class="tema-toggle" title="Cambiar tema">☀️</button>

    <script src="../js/ui.js"></script>
</body>
</html>
